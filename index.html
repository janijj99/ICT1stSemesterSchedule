<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT 2nd Semester Schedule</title>

    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
            background: #000;
            color: white;
        }

        /* Background Blur */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("wp.png.jpg");
            background-size: cover;
            background-position: center;
            filter: blur(10px);
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* Heading */
        h1 {
            font-size: 38px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Date */
        #date-info {
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* Glass Card */
        #schedule {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 16px;
            display: inline-block;
            min-width: 360px;
        }

        /* Table Style */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 16px;
        }

        th {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        tr:hover td {
            background: rgba(0, 255, 255, 0.15);
        }

        .time {
            color: #00ffff;
            font-weight: bold;
        }

        .no-class {
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>ICT 2nd Semester – Today's Schedule</h1>
    <p id="date-info"></p>
    <div id="schedule"></div>

    <script>

        const today = new Date();
        const date = today.getDate();
        const month = today.getMonth() + 1;
        const year = today.getFullYear();
        const day = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][today.getDay()];

        document.getElementById("date-info").innerHTML =
            "Today is <b>" + day + "</b> | " + date + "/" + month + "/" + year;

        const timeTable = {
            "Monday": [["10:30-11:30", "Python-PKV"], ["11:30-12:30", "Engineering Chemistry"], ["12:30-1:30", "CPD"], ["2:00-3:00", "ICT-1 (CPD)"], ["3:00-4:00", "ICT-2 (Chem)"], ["4:10-5:10", "IC"], ["5:10-6:10", "ICT-2 (CPD)"]],
            "Tuesday": [["10:30-11:30", "CPD"], ["11:30-12:30", "Engineering Chemistry"], ["12:30-1:30", "Python-PKV"], ["2:00-3:00", "ICT-1 Python Lab"], ["3:00-4:00", "ICT-2 PCB Lab"], ["4:10-5:10", "ICT-1 (Chem)"], ["5:10-6:10", "ICT-2 Maths Tutorial"]],
            "Wednesday": [["10:30-11:30", "Python-PKV"], ["11:30-12:30", "ENVI-PKV"], ["12:30-1:30", "Applied Maths"], ["2:00-3:00", "ICT-1 PCB Lab"], ["3:00-4:00", "ICT-2 Python Lab"], ["4:10-5:10", "ICT-1 Maths Tutorial"], ["5:10-6:10", "No Class"]],
            "Thursday": [["10:30-11:30", "No Class"], ["11:30-12:30", "Engineering Chemistry"], ["12:30-1:30", "Applied Maths"], ["2:00-3:00", "ICT-1 PCB Lab"], ["3:00-4:00", "ICT-2 PCB Lab"], ["4:10-5:10", "IC"], ["5:10-6:10", "No Class"]],
            "Friday": [["10:30-11:30", "No Class"], ["11:30-12:30", "Applied Maths"], ["12:30-1:30", "ENVI-PKV"], ["2:00-3:00", "ICT-1 PCB Lab"], ["3:00-4:00", "ICT-2 PCB Lab"], ["4:10-5:10", "No Class"], ["5:10-6:10", "No Class"]],
            "Saturday": [["10:30-11:30", "No Class"], ["11:30-12:30", "No Class"], ["12:30-1:30", "No Class"], ["2:00-3:00", "No Class"], ["3:00-4:00", "No Class"], ["4:10-5:10", "No Class"], ["5:10-6:10", "No Class"]]
        };

        let dailyClasses = timeTable[day];
        let html = "<h3>Today's Classes</h3>";

        if (day === "Sunday" || !dailyClasses) {
            html += "<div class='no-class'>No classes today 😎</div>";
        } else {
            html += "<table>";
            html += "<tr><th>Time</th><th>Subject</th></tr>";
            dailyClasses.forEach(c => {
                html += `<tr><td class="time">${c[0]}</td><td>${c[1]}</td></tr>`;
            });
            html += "</table>";
        }

        document.getElementById("schedule").innerHTML = html;

    </script>

</body>

</html>
